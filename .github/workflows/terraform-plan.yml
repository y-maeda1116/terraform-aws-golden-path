name: Terraform Plan

on:
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "modules/compute/lambda/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: terraform plan (oidc)
    # fork・未設定リポジトリでは AWS 変数が無いためスキップ（CI を緑に保つ）
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      # tee が plan の失敗を吸わないよう pipefail を有効化
      - name: terraform plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      # plan 失敗時も出力を summary に残す（init 失敗時は plan.txt が無いのでスキップ）
      - name: Post plan to job summary
        if: always()
        run: |
          [ -f plan.txt ] || exit 0
          {
            echo "## Terraform plan"
            echo '<details><summary>plan output</summary>'
            echo ''
            echo '```'
            cat plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact
        with:
          name: tfplan
          path: environments/prod/tfplan
          retention-days: 7

  apply:
    name: terraform apply (manual)
    # 手動実行のみ。environment の approval gate で保護する（README 参照）
    # plan とは別の apply 専用ロールを使う（least privilege）。未設定ならスキップ
    if: github.event_name == 'workflow_dispatch' && vars.AWS_APPLY_ROLE_ARN != ''
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # hashicorp/setup-terraform
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Download plan artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # actions/download-artifact (v5)
        with:
          name: tfplan
          path: environments/prod

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      # plan job が保存した tfplan をそのまま適用する（plan → 承認 → apply の一致を保証）
      - name: terraform apply (saved plan)
        run: terraform apply -input=false -no-color tfplan
